# Attribution Guard — CI enforcement of .githooks/pre-push
#
# Local hooks protect this clone; CI protects EVERY clone. GitHub converts
# Co-Authored-By trailers into permanent contributor credit, so any commit
# carrying an unauthorized coding-agent watermark must never land on the
# remote — even if someone pushes with --no-verify from an unarmed clone.
#
# Contract (keep in lockstep with .githooks/pre-push watermark_lines):
#   ^\s*(co-authored-by:\s.*(commandcodebot|commandcode[.]ai|codebuff)
#      |(generated with|generated by)\s+codebuff)
#   (case-insensitive)
#
# Modes:
#   push          — scans exactly the commits the push introduced
#                   (event.before..event.after, with new-branch fallback)
#   pull_request  — scans base..head before merge
#   workflow_dispatch — full-history audit of every branch (standing sweep)

name: attribution-guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: ranges and audits need every commit

      - name: Determine commit range to scan
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          ZERO=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
                # New branch: scan everything not already on the default branch
                BASE=$(git merge-base origin/main "$AFTER" 2>/dev/null || echo "$AFTER")
              else
                BASE=$BEFORE
              fi
              echo "range=${BASE}..${AFTER}" >> "$GITHUB_OUTPUT"
              ;;
            pull_request)
              echo "range=${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "range=" >> "$GITHUB_OUTPUT" # empty = full-history audit
              ;;
          esac

      - name: Scan for unauthorized agent attribution
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -eu
          scan_commit () {
            local sha="$1"
            local hits
            hits="$(git log -1 --format=%B "$sha" \
              | grep -Ei '^[[:space:]]*(co-authored-by:[[:space:]].*(commandcodebot|commandcode[.]ai|codebuff)|(generated with|generated by)[[:space:]]+codebuff)' || true)"
            if [ -n "$hits" ]; then
              echo "::error file=$sha::commit ${sha} carries a disallowed agent watermark"
              echo "❌ ${sha}:"
              echo "$hits" | sed 's/^/    /'
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          }

          VIOLATIONS=0
          if [ -z "$RANGE" ]; then
            echo "🔍 full-history audit: scanning every branch head's ancestry"
            while read -r branch_sha; do
              for sha in $(git rev-list "$branch_sha"); do
                scan_commit "$sha"
              done
            done < <(git for-each-ref --format='%(objectname)' refs/remotes/origin | sort -u)
          else
            echo "🔍 scanning ${RANGE} for unauthorized agent attribution..."
            for sha in $(git rev-list --reverse "$RANGE" 2>/dev/null); do
              scan_commit "$sha"
            done
          fi

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ attribution-guard: ${VIOLATIONS} watermarked commit(s) — rewrite history before merging/pushing"
            exit 1
          fi
          echo "✅ attribution-guard: scan clean"
